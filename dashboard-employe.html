<!doctype html>
<html lang="fr">
  <head>

    <title>Tableau de bord - TechCorp RH</title>
    <meta

      content="Affichage de vos congés, votre matériel et de vos notes de frais. "
    />
    <!-- Application interne : on demande aux moteurs de recherche de ne pas indexer. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/main.css" />
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <div class="app">
      <!----------------------------------- HEADER ----------------------------------->
      <header class="topbar">

        <button class="topbar__menu">
          <svg
            class="nav__icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>

        <!----------------------------------- HEADER - LOGO ----------------------------------->
        <a href="dashboard-employe.html" class="brand">
          <img
            class="brand__logo"
            src="assets/logo.svg"
            alt="Logo de TechCorp RH"
          />
          TechCorp RH
        </a>

        <!----------------------------------- HEADER - ACTION ----------------------------------->

        <div class="topbar__actions">
          <a class="icon-link" href="#">
            <svg
              class="nav__icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"

              aria-hidden="true"
              focusable="false"
            >
              <path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"></path>

          </a>

      <nav>
        <h2>MON ESPACE</h2>
        <ul>
          <li>
            <a href=""
              ><svg

                fill="none"
                stroke="currentColor"

                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
